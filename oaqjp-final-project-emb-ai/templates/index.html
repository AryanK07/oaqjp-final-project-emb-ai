<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
  <main class="detector">
    <header>
      <h1>Emotion Detector</h1>
      <p>Find the dominant emotion in a sentence using IBM Watson NLP.</p>
    </header>
    <form id="emotion-form" action="{{ url_for('detect_emotion') }}">
      <label for="textToAnalyze">Text to analyze</label>
      <textarea id="textToAnalyze" name="textToAnalyze" rows="4"
        placeholder="Type or paste a sentence"></textarea>
      <button type="submit">Analyze emotion</button>
    </form>
    <section id="results" class="results" aria-labelledby="results-title">
      <h2 id="results-title">Result</h2>
      <p id="system_response" role="status">Your analysis will appear here.</p>
    </section>
  </main>
</body>
</html>
